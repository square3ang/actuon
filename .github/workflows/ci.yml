name: ci
on:
  push:
    tags: ['*']
jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git zig sdl3 sdl3_ttf portaudio sqlite lua54 libarchive ffmpeg vulkan-icd-loader vulkan-headers rust python base-devel pkgconf rclone
      - uses: actions/checkout@v4
      - run: cargo install naga-cli --version 30.0.1 --locked && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: zig build test
      - run: zig build tools -Doptimize=ReleaseSafe
      - run: python3 tests/golden_check.py "$PWD/zig-out/bin/chartdump"
      - name: Parser fuzz
        run: |
          ls "$PWD"/tests/charts/*.bm? "$PWD"/tests/charts/*.pms > fuzz-seeds.txt
          ./zig-out/bin/fuzz_parser fuzz-seeds.txt 20000 "$GITHUB_RUN_NUMBER"
      - run: zig build core -Doptimize=ReleaseSafe
      - run: cargo test --release
        working-directory: server
      - run: cargo build --release
        working-directory: server
      - run: cargo test --release
        working-directory: web
      - run: python3 tests/ir_e2e.py server/target/release/actuon-ir zig-out/bin/mkreplay tests/charts/stop.bms "$(mktemp -d)"
      - run: python3 tests/backup_check.py server/backup/backup.sh "$(mktemp -d)"
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - run: brew install sdl3 sdl3_ttf portaudio sqlite lua@5.4 libarchive ffmpeg pkgconf spirv-cross
      - run: cargo install naga-cli --version 30.0.1 --locked
      - run: zig build test
  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-portaudio mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-ffmpeg zip
            mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-spirv-cross
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - run: cargo install naga-cli --version 30.0.1 --locked && PATH="$HOME/.cargo/bin:$PATH" zig build test
