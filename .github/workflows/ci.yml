name: ci
on:
  push:
    tags: ['*']
  # Checks every platform without a tag, and releases nothing.
  workflow_dispatch:
# Building naga takes minutes, longest on Windows, so each OS caches the binary under .naga.
env: { NAGA_VERSION: 30.0.1 }
jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git zig sdl3 sdl3_ttf portaudio sqlite lua54 libarchive ffmpeg vulkan-icd-loader vulkan-headers rust python nodejs base-devel pkgconf patchelf
      - uses: actions/checkout@v4
      # A tag the binary does not report would offer the same update forever.
      - if: github.ref_type == 'tag'
        run: grep -qF ".version = \"${GITHUB_REF_NAME#v}\"" build.zig.zon
      - id: naga
        uses: actions/cache@v4
        with: { path: .naga, key: "naga-${{ env.NAGA_VERSION }}-${{ runner.os }}" }
      - if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked --root .naga
      - run: echo "$PWD/.naga/bin" >> "$GITHUB_PATH"
      - run: zig build test
      - run: node tests/site_lang.mjs
      - run: |
          curl -fsSLo /usr/local/bin/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          chmod +x /usr/local/bin/linuxdeploy
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: actuon-x86_64.AppImage, if-no-files-found: error }
  # The core, its tools and the server, apart from the game so the two run side by side. None of it needs naga.
  server:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm git zig sqlite rust python base-devel pkgconf rclone
      - uses: actions/checkout@v4
      - run: zig build tools -Doptimize=ReleaseSafe
      - run: python3 tests/golden_check.py "$PWD/zig-out/bin/chartdump"
      - name: Parser fuzz
        run: |
          ls "$PWD"/tests/charts/*.bm? "$PWD"/tests/charts/*.pms "$PWD"/tests/fuzz/*.bmson > fuzz-seeds.txt
          ./zig-out/bin/fuzz_parser fuzz-seeds.txt 20000 "$GITHUB_RUN_NUMBER"
      - run: zig build core -Doptimize=ReleaseSafe
      - run: cargo test --release
        working-directory: server
      - run: cargo build --release
        working-directory: server
      - run: cargo test --release
        working-directory: web
      - run: python3 tests/ir_e2e.py server/target/release/actuon-ir zig-out/bin/mkreplay tests/charts/stop.bms "$(mktemp -d)"
      - run: python3 tests/backup_check.py server/backup/backup.sh "$(mktemp -d)"
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - run: brew install sdl3 sdl3_ttf portaudio sqlite lua@5.4 libarchive ffmpeg pkgconf spirv-cross dylibbundler
      # Homebrew keeps these out of the default pkg-config path.
      - run: echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig:$(brew --prefix lua@5.4)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"
      - id: naga
        uses: actions/cache@v4
        with: { path: .naga, key: "naga-${{ env.NAGA_VERSION }}-${{ runner.os }}" }
      - if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked --root .naga
      - run: echo "$PWD/.naga/bin" >> "$GITHUB_PATH"
      - run: zig build test
      - run: packaging/macos/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: zig-out/package/actuon.dmg, if-no-files-found: error }
  windows:
    runs-on: windows-latest
    defaults: { run: { shell: 'msys2 {0}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # setup-zig puts zig on the runner's PATH, which MSYS2 hides by default.
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sdl3 mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-portaudio-asio mingw-w64-ucrt-x86_64-sqlite3 mingw-w64-ucrt-x86_64-lua54
            mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-ffmpeg zip
            mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-spirv-cross
      - run: grep -qa PaAsio_ /ucrt64/bin/libportaudio*.dll
      - uses: mlugg/setup-zig@v2
        with: { version: 0.17.0 }
      - id: naga
        uses: actions/cache@v4
        with: { path: .naga, key: "naga-${{ env.NAGA_VERSION }}-${{ runner.os }}" }
      - if: steps.naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked --root .naga
      # MSYS2 paths do not survive GITHUB_PATH, so each step adds naga itself.
      - run: PATH="$PWD/.naga/bin:$PATH" zig build test
      - run: PATH="$PWD/.naga/bin:$PATH" packaging/windows/package.sh
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: zig-out/actuon-windows.zip, if-no-files-found: error }
  release:
    needs: [linux, server, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env: { GH_TOKEN: "${{ github.token }}" }
