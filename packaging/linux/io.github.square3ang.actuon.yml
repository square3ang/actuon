# Build: flatpak-builder --user --install build packaging/linux/io.github.square3ang.actuon.yml
app-id: io.github.square3ang.actuon
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions: [org.freedesktop.Sdk.Extension.rust-stable]
command: actuon
finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
modules:
  - name: portaudio
    config-opts: [--disable-static, --without-oss]
    no-parallel-make: true
    sources:
      - type: archive
        url: https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz
        sha256: 47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def
  - name: lua
    no-autogen: true
    buildsystem: simple
    build-commands:
      - make linux MYCFLAGS=-fPIC
      - make install INSTALL_TOP=/app
      - |
        mkdir -p /app/lib/pkgconfig
        printf 'Name: lua5.4\nDescription: Lua\nVersion: 5.4.8\nLibs: -L/app/lib -llua -lm -ldl\nCflags: -I/app/include\n' > /app/lib/pkgconfig/lua5.4.pc
    sources:
      - type: archive
        url: https://www.lua.org/ftp/lua-5.4.8.tar.gz
        sha256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DSDL_TESTS=OFF]
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.2.26/SDL3-3.2.26.tar.gz
        sha256: dad488474a51a0b01d547cd2834893d6299328d2e30f479a3564088b5476bae2
  - name: sdl3-ttf
    buildsystem: cmake-ninja
    config-opts: [-DCMAKE_BUILD_TYPE=Release]
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz
        sha256: 63547d58d0185c833213885b635a2c0548201cc8f301e6587c0be1a67e1e045d
  - name: ffmpeg
    config-opts: [--enable-shared, --disable-static, --disable-programs, --disable-doc, --disable-network, --disable-encoders, --disable-muxers]
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz
        sha256: b2751fccb6cc4c77708113cd78b561059b6fa904b24162fa0be2d60273d27b8e
  - name: actuon
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/run/build/actuon/cargo/bin
      build-args: [--share=network]
    build-commands:
      - cargo install naga-cli --version 30.0.1 --locked --root /run/build/actuon/cargo
      - /run/build/actuon/zig/zig build -Doptimize=ReleaseSafe --prefix /app --global-cache-dir /run/build/actuon/.zig-global
      - install -Dm644 packaging/linux/io.github.square3ang.actuon.desktop /app/share/applications/io.github.square3ang.actuon.desktop
      - install -Dm644 packaging/linux/io.github.square3ang.actuon.svg /app/share/icons/hicolor/scalable/apps/io.github.square3ang.actuon.svg
    sources:
      - type: dir
        path: ../..
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        dest: zig
