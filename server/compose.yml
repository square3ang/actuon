services:
  ir:
    image: localhost/actuon-ir
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: always
    # The server and two checks at their 1 GiB limit.
    mem_limit: 3g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      # Plain HTTP: put a TLS proxy in front before opening this to the internet.
      - "127.0.0.1:${IR_PORT:-8730}:8730"
    volumes:
      - data:/data

  web:
    image: localhost/actuon-web
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: always
    depends_on:
      ir:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8731}:8731"

  backup:
    image: localhost/actuon-backup
    build: backup
    profiles: [backup]
    restart: always
    depends_on:
      ir:
        condition: service_healthy
    environment:
      RCLONE_CONFIG_BACKUP_TYPE: s3
      RCLONE_CONFIG_BACKUP_PROVIDER: Other
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${S3_ENDPOINT:-}
      RCLONE_CONFIG_BACKUP_REGION: ${S3_REGION:-auto}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # An R2 token limited to one bucket may not list buckets.
      RCLONE_CONFIG_BACKUP_NO_CHECK_BUCKET: "true"
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - data:/data

volumes:
  data:
