[package]
name = "actuon-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
serde_json = "1"
